name: Feature Request
description: Suggest an idea or enhancement for statsFM
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for **statsFM**!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: I'm always frustrated when...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: It would be awesome if statsFM could...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context or Mockups
      description: Add any other context, screenshots, or design ideas.
    validations:
      required: false
